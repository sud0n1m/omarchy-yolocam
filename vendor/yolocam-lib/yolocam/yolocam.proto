syntax = "proto3";

package tv.yunxi.protobuf;

enum MessageType {
    TYPE_NONE = 0;
    TYPE_REQUEST = 1;
    TYPE_SET = 2;
    TYPE_POST = 3;
    TYPE_RESPONSE = 4;
    TYPE_NOTIFY = 5;
}

